name: build-jni

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install libs for old NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses5 libtinfo5

      - name: Download NDK r16b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip
          unzip -q android-ndk-r16b-linux-x86_64.zip -d $HOME

      - name: Clean old build files
        run: rm -rf obj libs jni/obj jni/libs

      - name: Convert line endings to LF
        run: |
          find jni -type f \( -name '*.mk' -o -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' \) -exec sed -i 's/\r$//' {} +

      - name: Fix include paths in Android.mk
        run: |
          sed -i 's#^LOCAL_C_INCLUDES := \$(LOCAL_PATH)/vendor/json/json#LOCAL_C_INCLUDES := $(LOCAL_PATH) $(LOCAL_PATH)/app $(LOCAL_PATH)/cryptors $(LOCAL_PATH)/game $(LOCAL_PATH)/game/Custom $(LOCAL_PATH)/game/RW $(LOCAL_PATH)/game/TextRasterizer $(LOCAL_PATH)/graphics $(LOCAL_PATH)/gui $(LOCAL_PATH)/net $(LOCAL_PATH)/util $(LOCAL_PATH)/vendor $(LOCAL_PATH)/vendor/bass $(LOCAL_PATH)/vendor/curl/include $(LOCAL_PATH)/vendor/hash $(LOCAL_PATH)/vendor/hash/bcrypt $(LOCAL_PATH)/vendor/hash/bcrypt/crypt_blowfish $(LOCAL_PATH)/vendor/imgui $(LOCAL_PATH)/vendor/ini $(LOCAL_PATH)/vendor/obfuscate $(LOCAL_PATH)/vendor/openal $(LOCAL_PATH)/vendor/opus $(LOCAL_PATH)/vendor/raknet $(LOCAL_PATH)/vendor/raknet/SAMP $(LOCAL_PATH)/voice $(LOCAL_PATH)/xrtutils $(LOCAL_PATH)/vendor/json/json#' jni/Android.mk

      - name: Force-include enet.h
        run: |
          sed -i 's#^LOCAL_CPPFLAGS := \(.*\)$#LOCAL_CPPFLAGS := \1 -include $(LOCAL_PATH)/vendor/enet/include/enet.h#' jni/Android.mk
          grep -n "^LOCAL_CPPFLAGS" jni/Android.mk

      - name: Fix case-mismatched includes
        run: |
          cd jni
          find . -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' \) | while read -r f; do
            d=$(dirname "$f")
            grep -oE '#include[[:space:]]*"[^"]+"' "$f" | sed -E 's/.*"([^"]+)"/\1/' | while read -r inc; do
              t=$(realpath -m "$d/$inc")
              [ -e "$t" ] && continue
              m=$(find "$(pwd)" -type f -iname "$(basename "$inc")" -not -path '*/obj/*' -not -path '*/libs/*' | head -n1)
              [ -n "$m" ] || continue
              mkdir -p "$(dirname "$t")"
              ln -s "$m" "$t"
            done
          done

      - name: Build native library
        run: |
          $HOME/android-ndk-r16b/ndk-build \
            NDK_PROJECT_PATH="${{ github.workspace }}" \
            APP_BUILD_SCRIPT="${{ github.workspace }}/jni/Android.mk" \
            APP_ABI=armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: libs
          path: libs/

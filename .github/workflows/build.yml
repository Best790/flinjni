name: build-jni

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download NDK r16b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip
          unzip -q android-ndk-r16b-linux-x86_64.zip -d $HOME
          echo "NDK=$HOME/android-ndk-r16b" >> $GITHUB_ENV

      - name: Build native library
        run: |
          $NDK/ndk-build NDK_PROJECT_PATH=$GITHUB_WORKSPACE \
            APP_BUILD_SCRIPT=$GITHUB_WORKSPACE/jni/Android.mk \
            APP_ABI=armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: libs
          path: libs/

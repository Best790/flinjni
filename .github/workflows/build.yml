name: build-jni

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install libs for old NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses5 libtinfo5

      - name: Download NDK r16b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip
          unzip -q android-ndk-r16b-linux-x86_64.zip -d $HOME
          echo "NDK=$HOME/android-ndk-r16b" >> $GITHUB_ENV

      - name: Clean old build files
        run: rm -rf obj libs jni/obj jni/libs

      - name: Fix case-mismatched includes
        run: |
          cd jni
          find . \( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' \) | while read f; do
            d=$(dirname "$f")
            grep -oE '#include[[:space:]]*"[^"]+"' "$f" | sed -E 's/.*"([^"]+)"/\1/' | while read inc; do
              [ -e "$d/$inc" ] && continue
              [ -e "$inc" ] && continue
              m=$(find . -iname "$(basename "$inc")" -not -path '*/obj/*' -not -path '*/libs/*' | head -n1)
              [ -n "$m" ] && ln -sf "$(realpath --relative-to="$d" "$m")" "$d/$inc" 2>/dev/null || true
            done
          done

      - name: Build native library
        run: |
          $NDK/ndk-build NDK_PROJECT_PATH=$GITHUB_WORKSPACE \
            APP
